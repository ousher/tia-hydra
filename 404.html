<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google tag (gtag.js) — Google Ads conversion tracking -->
<!-- Consent Mode v2 — defaults denied until the visitor chooses.
     Must run BEFORE gtag.js. Google requires all four signals for EEA traffic
     (mandatory since 2024-03-06) or remarketing + conversion modelling are off. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    functionality_storage: 'granted',
    security_storage: 'granted',
    wait_for_update: 500
  });
  try {
    if (localStorage.getItem('hydra-consent') === 'granted') {
      gtag('consent', 'update', {
        ad_storage: 'granted', ad_user_data: 'granted',
        ad_personalization: 'granted', analytics_storage: 'granted'
      });
    }
  } catch (e) {}
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18155860192"></script>
<script>
  gtag('js', new Date());
  gtag('config', 'AW-18155860192');
</script>
<title>404 — HYDRA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050507">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/style.css">
<style>
  .err-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    position: relative;
    z-index: 2;
  }
  .err-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(80px, 18vw, 180px);
    font-weight: 700;
    line-height: 1;
    color: var(--hydra);
    text-shadow: 0 0 40px var(--hydra-glow);
    letter-spacing: -4px;
  }
  .err-mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .err-mark::before { content: '◢ '; color: var(--hydra); }
  .err-msg {
    color: var(--text-dim);
    font-size: 18px;
    max-width: 480px;
    margin: 18px 0 8px;
  }
  .err-msg .cz { display: block; font-size: 14px; color: var(--text-muted); margin-top: 6px; }
  .err-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 32px; }
  /* Značkový pruh. Slepá ulička je pořád náš dům — ať to i tak vypadá.
     Poměr 4:1, takže na úzkém displeji se jen zmenší, nikdy neroztáhne. */
  .err-banner {
    margin-top: 34px;
    width: min(600px, 100%);
    /* 🔴 height:auto je POVINNÉ. Atributy width/height na <img> tu jsou kvůli
       rezervaci místa (proti poskakování layoutu), ale jakmile CSS přepíše
       šířku, výška se drží atributu a obrázek se svisle roztáhne. Změřeno:
       600×396 místo 600×150. Na snímku to vypadalo skoro dobře. */
    height: auto;
    border: 1px solid var(--border);
    display: block;
  }
</style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-mark">HYDRA · 404</div>
    <div class="err-code">404</div>
    <p class="err-msg">
      This trail went cold. The page you're looking for doesn't exist.
      <span class="cz">Tahle stopa vychladla. Hledaná stránka neexistuje.</span>
    </p>
    <div class="err-actions">
      <a href="/" class="btn-primary">Back to HYDRA</a>
      <a href="/cs/" class="btn-secondary">Česká verze</a>
    </div>
    <img class="err-banner"
         src="/hydra-banner.png"
         srcset="/hydra-banner.png 1584w, /hydra-banner@2x.png 3168w"
         sizes="min(600px, 100vw)"
         width="1584" height="396" loading="lazy"
         alt="HYDRA — You don't get a dashboard. You get evidence.">
  </div>
<script src="/consent.js" defer></script>
</body>
</html>
