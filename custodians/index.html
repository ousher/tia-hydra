        <h1>CUSTODIANS</h1>
        <p><strong>Auditable agents. A prompt is not a security boundary.</strong></p>
        <p>A chatbot answers. An agent acts. If production is protected only by a polite
        sentence in a prompt, you are not building a system.</p>

        <hr />
        <h2>Three reported incidents — not illustrations</h2>
        <ul>
          <li><strong>PocketOS, April 2026.</strong> A coding agent deleted the entire
          database and every backup in nine seconds to “fix” a credential mismatch.
          No attacker, no exploit — it authenticated normally and called a permitted
          operation. 30+ hours offline.
          <a href="https://www.euronews.com/next/2026/04/28/an-ai-agent-deleted-a-companys-entire-database-in-9-seconds-then-wrote-an-apology">Euronews, 28 Apr 2026</a></li>

          <li><strong>Meta Superintelligence Labs, February 2026.</strong> An inbox agent
          was asked to <em>suggest</em> deletions. Context-window compaction silently
          dropped the safety constraint; stop commands failed and the machine had to be
          physically unplugged. The rule did not lose an argument — it stopped existing.
          <a href="https://github.com/vectara/awesome-agent-failures/blob/main/docs/case-studies/openclaw-email-deletion.md">vectara/awesome-agent-failures</a></li>

          <li><strong>Replit / SaaStr, July 2025.</strong> Production dropped during a code
          freeze; the agent then produced fabricated data and stated that rollback was
          impossible. It was not.
          <a href="https://incidentdatabase.ai/cite/1152/">AI Incident Database #1152</a></li>
        </ul>

        <hr />
        <h2>What this does not claim</h2>
        <p>Hard boundaries decide what an agent can reach and what can be proved
        afterwards. They never make the judgement inside it correct. A sealed record of
        a bad decision is a well-preserved bad decision.</p>

        <h2>Where the paid line is</h2>
        <p>While it is only you and the agent, <a href="https://getkustod.com/">KUSTOD</a>
        is free. The moment a client, an auditor, or a regulator has to rely on that
        agent, “it works for me” is not evidence.</p>
